name: Reusable CI

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch shared CI scripts
        uses: actions/checkout@v4
        with:
          repository: RogerNavelsaker/nixpkgs
          ref: main
          path: .nixpkgs-ci

      - name: Stage shared CI scripts
        run: |
          cp -r .nixpkgs-ci/ci "$RUNNER_TEMP/nixpkgs-ci"
          rm -rf .nixpkgs-ci

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: rogernavelsaker
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Sync checks
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          GH_TOKEN: ${{ github.token }}
        run: nix shell nixpkgs#jq -c bash "$RUNNER_TEMP/nixpkgs-ci/check-sync.sh"

      - name: Check Flake
        run: nix flake check --accept-flake-config

      - name: Build Default Package
        run: nix build .#default --accept-flake-config --no-link
