name: Reusable Sync Upstream

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      META_FLAKE_DISPATCH_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.META_FLAKE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch shared CI scripts
        uses: actions/checkout@v4
        with:
          repository: RogerNavelsaker/nixpkgs
          ref: main
          path: .nixpkgs-ci

      - name: Stage shared CI scripts
        run: |
          cp -r .nixpkgs-ci/ci "$RUNNER_TEMP/nixpkgs-ci"
          rm -rf .nixpkgs-ci

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: rogernavelsaker
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/nixpkgs-ci/sync-update.sh"

      - name: Read synced version
        id: version
        run: |
          nix shell nixpkgs#jq -c bash -c '. "$RUNNER_TEMP/nixpkgs-ci/lib.sh"; echo "value=$(read_version || true)" >> "$GITHUB_OUTPUT"'

      - name: Build default package (before commit)
        run: nix build .#default --accept-flake-config --no-link

      - name: Commit to default branch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "chore: sync upstream ${{ steps.version.outputs.value }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify sync (fails run if version is stale)
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix shell nixpkgs#jq -c bash "$RUNNER_TEMP/nixpkgs-ci/check-sync.sh"

      - name: Notify meta-flake
        if: steps.commit.outputs.changed == 'true'
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then echo "META_FLAKE_DISPATCH_TOKEN unset; skipping dispatch"; exit 0; fi
          GH_TOKEN="$DISPATCH_TOKEN" gh api repos/RogerNavelsaker/nixpkgs/dispatches \
            -f event_type=nixpkg-updated -f "client_payload[repo]=${GITHUB_REPOSITORY#*/}"
